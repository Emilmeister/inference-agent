# Operator-defined BASELINE launch config (anchor experiment) — MiniMaxAI/MiniMax-M3-MXFP8.
#
# Воспроизводит реальную прод-команду:
#   docker run --gpus all --privileged --ipc=host -p 8000:8000 \
#     -v ~/.cache/huggingface:/root/.cache/huggingface \
#     vllm/vllm-openai:minimax-m3 MiniMaxAI/MiniMax-M3-MXFP8 \
#     --block-size 128 --enable-expert-parallel --tensor-parallel-size 8 \
#     --max-num-batched-tokens 8192 --gpu-memory-utilization 0.95 \
#     --max-num-seqs 256 --max-model-len auto \
#     --tool-call-parser minimax_m3 --enable-auto-tool-choice \
#     --reasoning-parser minimax_m3 \
#     --speculative-config '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3", "num_speculative_tokens": 3, "attention_backend": "FLASH_ATTN"}' \
#     --mm-encoder-attn-backend FLASHINFER --mm-processor-cache-type shm \
#     --mm-encoder-tp-mode data
#
# Shaped like an ExperimentConfig. Sibling baseline of config7.yaml (paired by
# numeric suffix). Runs deterministically as experiment #1 — WITHOUT the LLM
# planner. Flags with dedicated schema fields live in those fields; everything
# else passes verbatim through extra_engine_args (same order as the prod command).
#
# NOTE: --tool-call-parser / --reasoning-parser / --enable-auto-tool-choice are
# always appended by container.vllm_extra_args in config7.yaml — NOT repeated here.
#
# NOT EXPRESSIBLE в схеме рантайма (см. сводку в config7.yaml):
#   --privileged, --ipc=host — у nerdctl-обёртки их нет; --ipc=host частично
#     замещается container.shm_size (поднят в config7.yaml).
#   --trust-remote-code прод НЕ передаёт (образ vllm/vllm-openai:minimax-m3 уже
#     содержит код M3) — поэтому его нет и в config7.container.vllm_extra_args.
# DELIBERATELY OMITTED:
#   --served-model-name / путь — harness адресует по HF id из примонтированного кэша.
#   --host 0.0.0.0 / --port 8000 — инжектит engine builder.
#   --quantization — веса нативно MXFP8, vLLM autodetect'ит из config.json.

engine: vllm

# Весь узел 8xH100 (--gpus all → CUDA_VISIBLE_DEVICES=0..7 через gpu_count=8).
tensor_parallel_size: 8

# Прод запускает с `--max-model-len auto` (= нативные 1M токенов модели).
# Здесь окно ФИКСИРОВАНО на 131072, чтобы baseline-якорь был сопоставим с
# планируемыми экспериментами (top-level max_model_len в config7 = 131072) и
# чтобы KV-бюджет не уходил на нереалистичный 1M контекст.
#   → Чтобы воспроизвести прод буквально (auto): поставь здесь `max_model_len:`
#     в null И добавь "--max-model-len", "auto" в начало extra_engine_args.
max_model_len: 131072

gpu_memory_utilization: 0.95
max_num_seqs: 256
max_num_batched_tokens: 8192

# Веса предквантованы в MXFP8 (config.json: quant_method=mxfp8) → vLLM autodetect,
# --quantization НЕ передаём. dtype вычислений — bfloat16 (как torch_dtype модели;
# прод не передаёт --dtype, движок берёт bf16 — эквивалентно).
quantization: null
dtype: bfloat16

# Прод не передаёт эти флаги явно — в vLLM V1 prefix caching и chunked prefill
# включены по умолчанию. enable_prefix_caching=true держим явно: для движка это
# no-op, но ОБЯЗАТЕЛЬНО, чтобы пройти agentic prefix-cache gate валидатора (иначе
# якорь будет пропущен под agentic-целью).
enable_prefix_caching: true
enable_chunked_prefill: true

# Speculative decoding EAGLE3 — задаётся целиком как JSON через --speculative-config
# (dedicated-поля схемы не умеют method/attention_backend), поэтому идёт в
# extra_engine_args ниже, а speculative_* поля оставлены пустыми.

# Flags without a dedicated ExperimentConfig field — verbatim, в порядке прод-команды.
#   --block-size 128            — размер KV-блока
#   --enable-expert-parallel    — expert parallelism для MoE (128 экспертов)
#   --speculative-config        — EAGLE3 draft (Inferact/MiniMax-M3-EAGLE3, 3 токена)
#   --mm-encoder-*              — мультимодальный энкодер (в текстовом бенче не задействован)
extra_engine_args:
  - "--block-size"
  - "128"
  - "--enable-expert-parallel"
  - "--speculative-config"
  - '{"method": "eagle3", "model": "Inferact/MiniMax-M3-EAGLE3", "num_speculative_tokens": 3, "attention_backend": "FLASH_ATTN"}'
  - "--mm-encoder-attn-backend"
  - "FLASHINFER"
  - "--mm-processor-cache-type"
  - "shm"
  - "--mm-encoder-tp-mode"
  - "data"

rationale: >-
  Operator-defined baseline = прод-команда MiniMaxAI/MiniMax-M3-MXFP8 на H100x8:
  TP=8, нативный MXFP8 (vLLM autodetect, без --quantization), bfloat16 compute,
  expert-parallel MoE (128 экспертов top-4), block-size=128, EAGLE3 spec-decode
  (Inferact/MiniMax-M3-EAGLE3, 3 draft-токена, FLASH_ATTN), мультимодальный
  энкодер на FLASHINFER + shm-кэш + data-TP, prefix+chunked prefill (V1 default),
  gpu_mem_util=0.95, max_num_seqs=256, max_num_batched_tokens=8192. Контекст
  зафиксирован на 131072 (прод: auto=1M) для сопоставимости якоря с планируемыми
  экспериментами. Задача агента — побить это по целям оптимизации, не сломав
  корректность.
