# Operator-defined BASELINE launch config (anchor experiment) — MiniMaxAI/MiniMax-M3-MXFP8.
#
# ИСТОЧНИК: лучший прогон, НАЙДЕННЫЙ АГЕНТОМ (эксперимент 5d4a77fd40fb), промоутнут
# в baseline-якорь. Прод-команда больше не воспроизводится дословно — стартовали от
# неё, но fp8 KV/EAGLE3 не влезли на стенд (см. ниже), а агент нашёл рабочую и
# быструю конфигурацию под agentic-цель. Полная найденная команда:
#   ... --tensor-parallel-size 8 --dtype bfloat16 --gpu-memory-utilization 0.96 \
#       --max-model-len 200000 --max-num-seqs 16 --max-num-batched-tokens 16384 \
#       --enable-chunked-prefill --enable-prefix-caching --block-size 128 \
#       --enable-expert-parallel --max-cudagraph-capture-size 8 \
#       --performance-mode interactivity \
#       (+ парсеры/mm-флаги из config7.container.vllm_extra_args)
#
# Shaped like an ExperimentConfig. Sibling baseline of config7.yaml (paired by
# numeric suffix). Runs deterministically as experiment #1 — WITHOUT the LLM
# planner. Flags with dedicated schema fields live in those fields; everything
# else passes verbatim through extra_engine_args (same order as the found command).
#
# NOTE: эти флаги ВСЕГДА добавляются из container.vllm_extra_args в config7.yaml —
# здесь НЕ дублируются: --tool-call-parser / --reasoning-parser /
# --enable-auto-tool-choice, мультимодальный энкодер (--mm-encoder-attn-backend
# FLASHINFER, --mm-processor-cache-type shm, --mm-encoder-tp-mode data) И mm-лимиты
# (--limit-mm-per-prompt, --mm-processor-kwargs), которые кэпят worst-case видео,
# чтобы профилировщик не падал в startup OOM. Mm-настройки — единый источник в
# config7, т.к. они model-invariant и нужны и якорю, и планируемым экспериментам.
#
# NOT EXPRESSIBLE в схеме рантайма (см. сводку в config7.yaml):
#   --privileged, --ipc=host — у nerdctl-обёртки их нет; --ipc=host частично
#     замещается container.shm_size (поднят в config7.yaml).
#   --trust-remote-code прод НЕ передаёт (образ vllm/vllm-openai:minimax-m3 уже
#     содержит код M3) — поэтому его нет и в config7.container.vllm_extra_args.
# DELIBERATELY OMITTED:
#   --served-model-name / путь — harness адресует по HF id из примонтированного кэша.
#   --host 0.0.0.0 / --port 8000 — инжектит engine builder.
#   --quantization — веса нативно MXFP8, vLLM autodetect'ит из config.json.

engine: vllm

# Весь узел 8xH100 (--gpus all → CUDA_VISIBLE_DEVICES=0..7 через gpu_count=8).
tensor_parallel_size: 8

# Прод запускает с `--max-model-len auto` (= нативные 1M токенов модели).
# Здесь окно ФИКСИРОВАНО на 200000 — РОВНО как top-level max_model_len в config7,
# чтобы baseline-якорь был сопоставим с планируемыми экспериментами, и чтобы
# KV-бюджет не уходил на нереалистичный 1M контекст. Если меняешь окно — меняй
# синхронно в обоих файлах.
#   → Чтобы воспроизвести прод буквально (auto): поставь здесь `max_model_len:`
#     в null И добавь "--max-model-len", "auto" в начало extra_engine_args.
max_model_len: 200000

# Найденные агентом значения. max_num_seqs=16 — низкий (agentic-нагрузка
# малоконкурентна), что вместе с --max-cudagraph-capture-size 8 резко уменьшает
# память на захват CUDA-графов (та фаза раньше падала) и освобождает её под KV.
gpu_memory_utilization: 0.96
max_num_seqs: 16
max_num_batched_tokens: 16384

# Веса предквантованы в MXFP8 (config.json: quant_method=mxfp8) → vLLM autodetect,
# --quantization НЕ передаём. dtype вычислений — bfloat16 (как torch_dtype модели;
# прод не передаёт --dtype, движок берёт bf16 — эквивалентно).
quantization: null
dtype: bfloat16

# KV-кэш ТОЛЬКО bf16 (auto). fp8 НЕВОЗМОЖЕН: fused-ядро аттеншна MiniMax-M3
# (fused_minimax_m3_qknorm_rope_kv_insert) жёстко требует bf16 KV и падает с
# "kv_cache dtype must match qkv (bf16 cache only)". Поэтому --kv-cache-dtype не
# передаём (auto = bf16, как прод).
kv_cache_dtype: auto

# Прод не передаёт эти флаги явно — в vLLM V1 prefix caching и chunked prefill
# включены по умолчанию. enable_prefix_caching=true держим явно: для движка это
# no-op, но ОБЯЗАТЕЛЬНО, чтобы пройти agentic prefix-cache gate валидатора (иначе
# якорь будет пропущен под agentic-целью).
enable_prefix_caching: true
enable_chunked_prefill: true

# EAGLE3 spec-decode УБРАН (был в прод-команде через --speculative-config).
# Причина: на 8xH100 с bf16 KV (fp8 невозможен — ядро M3) контекст 200k и EAGLE3
# не помещаются вместе — draft-веса + его KV/графы съедают ~3.5-6 ГиБ, которых не
# хватает для KV на 200k (нужно 9.21 ГиБ при 6.64 доступных). Сняв draft,
# освобождаем эту память → 200k bf16 влезает. (Выбор оператора: 200k важнее
# ускорения декода.)
#
# Flags without a dedicated ExperimentConfig field — verbatim, в порядке найденной команды.
#   --block-size 128                 — размер KV-блока
#   --enable-expert-parallel         — expert parallelism для MoE (128 экспертов)
#   --max-cudagraph-capture-size 8   — кэп размера CUDA-графов (с max_num_seqs=16
#                                      убирает OOM на захвате графов, экономит VRAM)
#   --performance-mode interactivity — латентностный режим (под agentic-цель)
# Мультимодальные флаги (--mm-encoder-* + mm-лимиты) сюда НЕ кладём — они
# model-invariant и живут в config7.container.vllm_extra_args (единый источник).
extra_engine_args:
  - "--block-size"
  - "128"
  - "--enable-expert-parallel"
  - "--max-cudagraph-capture-size"
  - "8"
  - "--performance-mode"
  - "interactivity"

rationale: >-
  Agent-found best config (эксперимент 5d4a77fd40fb), промоутнут в baseline-якорь.
  MiniMaxAI/MiniMax-M3-MXFP8 на H100x8: TP=8, нативный MXFP8 (autodetect, без
  --quantization), bfloat16 compute, bf16 KV (fp8 невозможен — ядро M3),
  expert-parallel MoE (128 экспертов top-4), block-size=128, gpu_mem_util=0.96,
  max_num_seqs=16, max_num_batched_tokens=16384, max-cudagraph-capture-size=8,
  performance-mode=interactivity, контекст 200000, мультимодальный энкодер +
  mm-лимиты из config7.vllm_extra_args, prefix+chunked prefill. БЕЗ EAGLE3
  spec-decode (не помещается с bf16 KV на 200k). Это первая конфигурация, которая
  стабильно стартовала и прошла бенчмарк; задача агента — итерировать ОТ неё и
  побить по целям оптимизации, не сломав корректность.
