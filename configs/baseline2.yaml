# Operator-defined BASELINE launch config (anchor experiment) — Qwen3.6-35B-A3B.
#
# Shaped like an ExperimentConfig. Sibling baseline of config1.yaml (paired by
# numeric suffix). Runs deterministically as experiment #1 — WITHOUT the LLM
# planner — so the harness measures a real anchor. Flags with dedicated schema
# fields live in those fields; everything else passes verbatim through
# extra_engine_args (same order as the prod command). Env vars go in extra_env.
#
# NOTE: --reasoning-parser / --tool-call-parser / --enable-auto-tool-choice are
# always appended by container.vllm_extra_args in config1.yaml — NOT repeated here.
#
# DELIBERATELY OMITTED:
#   --served-model-name Qwen/Qwen3.6-35B-A3B and the /models/... path (harness
#     addresses by HF id from the mounted cache).
#   --host 0.0.0.0 / --port 8080 — injected by the engine builder (port 8000).
#   --scheduling-policy fcfs — already the default scheduling_policy.

engine: vllm

tensor_parallel_size: 4
max_model_len: 262144

gpu_memory_utilization: 0.88
max_num_seqs: 128
max_num_batched_tokens: 10240

quantization: fp8
dtype: bfloat16

enable_prefix_caching: true
enable_chunked_prefill: true

# Container environment variables — copied verbatim from the prod launch env.
# NOTE: VLLM_FLASH_ATTN_VERSION=2 here (the 397B baseline uses 3).
extra_env:
  TZ: "Europe/Moscow"
  CUDA_DISABLE_CONTROL: "true"
  OMP_NUM_THREADS: "96"
  NCCL_CUMEM_ENABLE: "true"
  VLLM_FLASH_ATTN_VERSION: "2"

# Flags without a dedicated ExperimentConfig field — passed verbatim, in the same
# order as the prod command. --enable-expert-parallel = MoE expert parallelism;
# --speculative-config = MTP speculative decoding (2 tokens).
extra_engine_args:
  - "--stream-interval"
  - "3"
  - "--async-scheduling"
  - "--performance-mode"
  - "throughput"
  - "--seed"
  - "1024"
  - "--optimization-level"
  - "3"
  - "--enable-expert-parallel"
  - "--enable-prompt-tokens-details"
  - "--enable-force-include-usage"
  - "--speculative-config"
  - '{"method":"qwen3_next_mtp","num_speculative_tokens":2}'

rationale: >-
  Operator-defined baseline (prod Qwen3.6-35B-A3B-FP8 on H100x4): TP=4, native
  fp8, bfloat16, expert-parallel MoE, MTP speculative decoding (2 tokens),
  prefix+chunked prefill, async scheduling + throughput perf-mode, optimization
  level 3, gpu_mem_util=0.88, max_num_seqs=128, max_num_batched_tokens=10240,
  ctx=262144. The agent's job is to beat this on the optimization goals without
  breaking correctness.
