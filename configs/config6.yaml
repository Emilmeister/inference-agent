# Модель для бенчмарка — MiniMaxAI/MiniMax-M2.5 (MoE), thinking-модель с reasoning
# (parser minimax_m2), tool calling (parser minimax_m2).
model_name: "MiniMaxAI/MiniMax-M2.5"
model_revision: null

# Квантизация фиксируется на уровне всего прогона, планировщик её не варьирует.
# Прод-команда передаёт --quantization fp8 явно — повторяем здесь.
quantization: fp8

# Контекстное окно фиксируется на уровне run, планировщик его не варьирует.
max_model_len: 196608

# LLM агента (для принятия решений — любой OpenAI-совместимый endpoint)
agent_llm:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
  temperature: 0.0
  structured_output_mode: "json_schema"

# Container runtime (nerdctl + containerd)
container:
  vllm_image: "vllm/vllm-openai:v0.22.0"
  sglang_image: "lmsysorg/sglang:latest"
  network: "host"
  shm_size: "16g"
  # TP=4 — модель закреплена на первых 4 картах стенда 8xH100 (GPU 0-3).
  gpu_count: 4
  model_cache_dir: "/root/.cache/huggingface/hub"

  # Model-invariant флаги корректности, добавляются к каждому vLLM-запуску
  # (baseline + планировщик). MiniMax-M2.5 — thinking-модель → reasoning-parser
  # minimax_m2 обязателен; tool calling — tool-call-parser minimax_m2 +
  # enable-auto-tool-choice.
  vllm_extra_args:
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - "minimax_m2"
    - "--reasoning-parser"
    - "minimax_m2"

# Поведение при старте движка (healthcheck, pull образа).
startup:
  hard_timeout_sec: 3600
  idle_timeout_sec: 1800
  log_scan_interval_sec: 10.0
  image_pull_timeout_sec: 900
  container_run_timeout_sec: 180

# Бенчмарк
benchmark:
  warmup_requests: 10
  concurrency_levels: [1, 16, 64, 256]
  prompt_lengths: [512, 4096, 32768]
  max_output_tokens: 256
  long_context_max_output_tokens: 8192
  duration_per_level_sec: 30
  timeout_sec: 600
  latency_threshold_ms: 2000

  enable_agentic_long_context: true

  agentic_shared_prefix_tokens: 0
  agentic_unique_prompt_tokens: 83000
  agentic_max_output_tokens: 16000
  agentic_tool_result_min_tokens: 1024
  agentic_tool_result_max_tokens: 1536
  agentic_turns_per_session: 1

  agentic_concurrency_levels: [2, 4, 6, 8, 10, 12, 14, 15, 16, 18, 20, 22, 24, 26, 28, 30]

  agentic_session_timeout_sec: 5400
  agentic_per_turn_timeout_sec: 1200

  agentic_ttft_p95_slo_ms: 30000
  agentic_tpot_p95_slo_ms: 33
  agentic_session_error_rate_slo: 0.05
  agentic_e2e_p95_slo_ms: 0

  agentic_concurrency_ceiling_search: false

# Эксперименты. Только vLLM (см. config.yaml).
experiments:
  max_experiments: 15
  plateau_threshold: 0.02
  plateau_window: 5
  engines: ["vllm"]
  max_params_per_step: 7

# Storage (logs only)
storage:
  logs_dir: "./logs"

# Inference-api REST сервис.
api:
  base_url: "http://localhost:8080"
  token_env: "INFERENCE_API_TOKEN"
  timeout_sec: 30.0

# Инструкции для LLM планировщика.
planner_instructions: |
  Бейзлайн вынесен в baseline6.yaml и прогоняется как измеренный эксперимент #1 —
  планировщик получает его точную команду и реальные метрики и итерирует ОТ него
  (по одному knob за раз). НЕ генерируй generic-бейзлайн заново.

  MiniMaxAI/MiniMax-M2.5 — MoE thinking-модель. quantization=fp8 фиксирован,
  dtype=bfloat16 (как в бейзлайне).

  Жёсткие инварианты (нельзя выкидывать): reasoning-parser minimax_m2,
  tool-call-parser minimax_m2 и enable-auto-tool-choice идут из
  container.vllm_extra_args — в extra_engine_args их НЕ дублируй.
  --enable-expert-parallel остаётся включённым (MoE) — не выключай.
  --compilation-config с cudagraph_mode PIECEWISE — рабочий выбор бейзлайна.
  
  Первым делом попробуй использовать kv-cache-dtype=fp8


# ─────────────────────────────────────────────────────────────────────────────
# quality — прод-валидация финалистов ПОСЛЕ сходимости поиска (report-only,
# на оптимизатор не влияет). Для топ-конфигов (agentic/latency/balanced)
# перезапускает контейнер и гоняет внешние суиты против эндпоинта. Дедуп по
# quality-fingerprint: финалисты с одинаковыми quality-полями → один прогон.
# Идемпотентно: повтор пропускает уже готовые суиты. Preflight на discovery
# падает сразу, если суиты не находятся/не запускаются.
# ─────────────────────────────────────────────────────────────────────────────
quality:
  enabled: true
  finalists: [agentic, latency, balanced]
  fingerprint_dedup: true
  preflight_strict: false                   # провал preflight → отключить quality, не валить прогон
  so_testing:                               # tool-calls + structured output (минуты)
    enabled: true
    interpreter: .venv/bin/python           # относительно cwd ниже
    cwd: /home/ansible/ermadatov/structured-output-testing
    suites: [so, tool, streaming]
    runs: 3
    temperature: 0.0
    max_tokens: 4096
    timeout_sec: 1800
  terminal_bench:                           # агентские сценарии через harbor (~2ч)
    enabled: true
    harbor_bin: /home/ansible/.local/bin/harbor
    path_prepend: [/home/ansible/.local/bin]   # каталог docker для harbor
    cwd: /home/ansible/ermadatov/terminal-bench2
    dataset: "terminal-bench@2.0"
    agent: terminus-2
    temperature: 0.1
    max_turns: 100
    n_concurrent: 5
    agent_timeout_multiplier: 5
    k: 1
    jobs_dir: jobs
    timeout_sec: 14400
