# =============================================================================
# ПРИМЕР КОНФИГА АГЕНТА (config[N].yaml) — со всеми полями и описанием
# =============================================================================
#
# Это эталонный, ПОЛНОСТЬЮ закомментированный конфиг одной модели. Скопируй его
# в `configs/config.yaml` (или `config1.yaml`, `config2.yaml`, ...) и оставь
# только нужные поля — почти всё имеет разумные дефолты и может быть опущено.
#
# Что обязательно: только `model_name`. Всё остальное опционально.
#
# Прогон:
#   inference-agent                       # серия: все configs/config[N].yaml по очереди
#   inference-agent -c configs/config.yaml  # ровно этот файл
#
# Каждому config[N].yaml сопоставляется sibling baseline[N].yaml по числовому
# суффиксу (см. configs/baseline.example.yaml). config.yaml ↔ baseline.yaml,
# config1.yaml ↔ baseline1.yaml и т.д.


# ─────────────────────────────────────────────────────────────────────────────
# МОДЕЛЬ (top-level)
# ─────────────────────────────────────────────────────────────────────────────

# HuggingFace repo id модели, которую бенчмаркаем. ЕДИНСТВЕННОЕ обязательное поле.
model_name: "Qwen/Qwen2.5-72B-Instruct"

# Конкретная ревизия/commit/branch на HF (null = main/latest).
model_revision: null

# HF-токен для приватных/gated моделей. Лучше не хранить в git, а пробросить
# через env (см. ниже про переменные окружения). null = публичная модель.
hf_token: null

# Квантизация ФИКСИРОВАНА на весь прогон — планировщик её НЕ варьирует.
# Значения: "fp8" | "awq" | "gptq" | "mxfp4" | ... | null (без квантизации).
# Для моделей с нативной квантизацией (gpt-oss → mxfp4) ставь null и дай движку
# autodetect'ить из config.json.
quantization: null

# Контекстное окно ФИКСИРОВАНО на весь прогон — планировщик его не варьирует.
# null → планировщик выбирает per-эксперимент (legacy). Когда задано — значение
# сообщается планировщику явно, а проверка agentic-oversize в валидаторе
# пропускается (оператор осознанно выбрал это окно).
max_model_len: 32768


# ─────────────────────────────────────────────────────────────────────────────
# agent_llm — LLM, ПРИНИМАЮЩИЙ РЕШЕНИЯ (planner/analyzer)
# Любой OpenAI-совместимый Chat Completions endpoint.
# ─────────────────────────────────────────────────────────────────────────────
agent_llm:
  base_url: "https://api.openai.com/v1"   # endpoint провайдера
  model: "gpt-4o-mini"                     # имя модели у провайдера

  # Ключ. Либо api_key напрямую (не коммить!), либо api_key_env — имя env-
  # переменной, из которой ключ читается. api_key имеет приоритет.
  api_key: null
  api_key_env: "OPENAI_API_KEY"

  temperature: 0.0          # 0 = детерминированные решения планировщика
  max_tokens: null          # лимит ответа LLM (null = без явного лимита)
  timeout_sec: 600          # таймаут одного вызова LLM

  # Режим structured output:
  #   "json_schema" — strict-схема (рекомендуется; OpenAI и современные провайдеры)
  #   "json_object" — провайдер гарантирует лишь валидный JSON, схема — в промпте
  structured_output_mode: "json_schema"

  # Мягкий бюджет в USD на весь прогон LLM-вызовов агента. null = без лимита.
  max_budget_usd: null


# ─────────────────────────────────────────────────────────────────────────────
# container — runtime движков (nerdctl + containerd)
# ─────────────────────────────────────────────────────────────────────────────
container:
  vllm_image: "vllm/vllm-openai:latest"     # образ vLLM
  sglang_image: "lmsysorg/sglang:latest"    # образ SGLang
  network: "host"                            # сеть контейнера
  shm_size: "16g"                            # /dev/shm (NCCL/tensor-parallel)

  # Сколько GPU отдать движкам, считая с индекса 0 (карты 0..gpu_count-1).
  # null = все карты, что видит nvidia-smi. Позволяет поделить общий 8xH100:
  # gpu_count: 4 → бенчмарк на первой половине. Видимость ограничивается через
  # CUDA_VISIBLE_DEVICES; discovery/validator/analyzer рассуждают именно об этом
  # подмножестве карт.
  gpu_count: null

  # Пути к HF-кэшу. ВАЖНО: оба пути должны указывать на подпапку `hub/` кэша,
  # а НЕ на корень кэша — иначе движки не найдут веса (см. длинный комментарий
  # в config.py). host_cache_dir — куда агент пишет префетч на хосте;
  # model_cache_dir — куда кэш монтируется ВНУТРИ контейнера.
  host_cache_dir: "~/.cache/huggingface/hub"
  model_cache_dir: "/root/.cache/huggingface/hub"

  # Фиксированные флаги движка (НЕ варьируются планировщиком, добавляются к
  # КАЖДОМУ запуску). Сюда кладут инварианты корректности — reasoning-parser,
  # tool-call-parser, enable-auto-tool-choice и т.п.
  vllm_extra_args: []
  sglang_extra_args: []


# ─────────────────────────────────────────────────────────────────────────────
# startup — поведение при старте движка (healthcheck, pull, префетч)
# ─────────────────────────────────────────────────────────────────────────────
startup:
  hard_timeout_sec: 1800        # общий потолок ожидания healthcheck (30 мин)
  idle_timeout_sec: 300         # нет прогресса в логах N сек → считаем зависанием
  log_scan_interval_sec: 10.0   # как часто читаем/сканируем логи контейнера

  image_pull_timeout_sec: 900   # таймаут `nerdctl pull` образа (15 мин)
  container_run_timeout_sec: 180 # таймаут `nerdctl run -d` (без healthcheck, 3 мин)

  # Предзагрузка весов в HF-кэш ДО запуска любого контейнера. Убирает провал
  # «первый запуск качает 60 ГБ 15 минут» и амортизирует загрузку на все
  # эксперименты.
  prefetch_model: true
  prefetch_allow_patterns:
    - "*.json"
    - "*.txt"
    - "*.jinja"
    - "*.safetensors"
    - "*.bin"
    - "tokenizer.model"
    - "tokenizer.json"


# ─────────────────────────────────────────────────────────────────────────────
# benchmark — что и как замеряем
# ─────────────────────────────────────────────────────────────────────────────
benchmark:
  warmup_requests: 10                       # прогрев перед замером
  # Сетка нагрузки: фазы строятся как concurrency_levels × prompt_lengths,
  # затем классифицируются по workload (agent_short / throughput / stress /
  # long_context).
  concurrency_levels: [1, 4, 16, 64, 128, 256, 512]
  prompt_lengths: [128, 512, 2048, 4096, 32768, 65536, 100000]
  max_output_tokens: 256                    # output на запрос в обычных фазах
  long_context_max_output_tokens: 8192      # output в long-context фазах (RAG)
  duration_per_level_sec: 60                # длительность замера одной фазы
  timeout_sec: 600                          # таймаут одного HTTP-запроса бенча
  latency_threshold_ms: 2000.0              # SLO TTFT p95 для balanced-цели
  phase_error_rate_threshold: 0.1           # фаза с error_rate выше — отбраковка
  seed: null                                # seed для воспроизводимых промптов

  # ── Agentic long-context workload — основная цель оптимизации для агентов ──
  # Форма реального трафика код-агента: общий system+tools префикс (переиспользуется
  # всеми параллельными сессиями через prefix caching) + небольшой уникальный блок
  # на сессию + N ходов, где каждый ход дописывает синтетический tool_result.
  enable_agentic_long_context: false

  # Разбиение промпта. shared_prefix строится ОДИН раз на фазу с детерминированным
  # seed (→ все сессии видят одинаковые токены → попадание в prefix-cache).
  agentic_shared_prefix_tokens: 16000
  agentic_unique_prompt_tokens: 8000

  agentic_max_output_tokens: 2400           # потолок output на ход
  agentic_tool_result_min_tokens: 1024      # размер синтетического tool_result
  agentic_tool_result_max_tokens: 1536
  agentic_turns_per_session: 4              # ходов на сессию

  # Полный свип concurrency; executor идёт по списку и останавливается после
  # двух подряд непрошедших SLO фаз.
  agentic_concurrency_levels: [8, 12, 16, 20, 24, 32, 48]
  agentic_session_timeout_sec: 600          # потолок на сессию (10 мин)
  agentic_per_turn_timeout_sec: 90          # бюджет одного HTTP-хода

  # SLO-гейт: фаза `viable`, только если выполнены ВСЕ условия ниже.
  agentic_ttft_p95_slo_ms: 3000.0           # ~3с до первого токена
  agentic_tpot_p95_slo_ms: 60.0             # ~16 tok/s устойчиво
  agentic_session_error_rate_slo: 0.05      # <5% упавших сессий
  agentic_e2e_p95_slo_ms: 0.0               # 0 → auto = 0.8 * session_timeout * 1000

  agentic_concurrency_ceiling_search: false # legacy escape hatch, no-op


# ─────────────────────────────────────────────────────────────────────────────
# experiments — бюджет и стратегия поиска
# ─────────────────────────────────────────────────────────────────────────────
experiments:
  max_experiments: 30           # потолок числа конфигураций за прогон
  plateau_threshold: 0.02       # улучшение < 2% считается «нет прогресса»
  plateau_window: 5             # окно plateau-детекции (последние N экспериментов)
  engines: ["vllm", "sglang"]   # какие движки перебирать

  # Сколько параметров планировщик может менять за шаг относительно стартовой
  # точки (baseline-якорь или предыдущий топ). МЯГКАЯ подсказка в промпт, не
  # жёсткий констрейнт: меньше = чище A/B-атрибуция, больше = крупнее прыжки.
  # Должно быть >= 1.
  max_params_per_step: 2


# ─────────────────────────────────────────────────────────────────────────────
# storage — только логи (эксперименты пишутся в Postgres через REST API)
# ─────────────────────────────────────────────────────────────────────────────
storage:
  logs_dir: "./logs"


# ─────────────────────────────────────────────────────────────────────────────
# api — endpoint и auth REST-сервиса inference-api
# Агент НИКОГДА не ходит в Postgres напрямую — только через этот сервис.
# ─────────────────────────────────────────────────────────────────────────────
api:
  base_url: "http://localhost:8080"
  token: null                       # либо токен напрямую (не коммить)...
  token_env: "INFERENCE_API_TOKEN"  # ...либо имя env-переменной с токеном
  timeout_sec: 30.0


# ─────────────────────────────────────────────────────────────────────────────
# quality — прод-валидация финалистов ПОСЛЕ сходимости поиска (report-only,
# на оптимизатор не влияет). Для 3 топ-конфигов (agentic/latency/balanced)
# перезапускает контейнер и гоняет внешние суиты. Дедуп по quality-fingerprint:
# финалисты с одинаковыми quality-полями (model/quant/dtype/tool-parser/...)
# дают один прогон. Идемпотентно: повтор пропускает уже готовые суиты.
# Выключено по умолчанию.
# ─────────────────────────────────────────────────────────────────────────────
quality:
  enabled: false
  finalists: [agentic, latency, balanced]   # какие лидерборды валидировать
  fingerprint_dedup: true
  so_testing:                               # tool-calls + structured output
    enabled: true
    # interpreter: голое имя ("python") → системный из PATH; путь с ~ / ./ /
    # абсолютный → как есть; относительный → от cwd (корня репо so-testing).
    interpreter: .venv/bin/python           # относительно cwd ниже
    cwd: /path/to/so-testing                # корень репо so-testing (для -m)
    suites: [so, tool, streaming]
    runs: 3
    temperature: 0.0
    max_tokens: 4096
    timeout_sec: 1800
  terminal_bench:                           # агентские сценарии (~2ч!), opt-in
    enabled: false
    harbor_bin: /home/ansible/.local/bin/harbor
    cwd: /home/ansible/ermadatov/terminal-bench2
    dataset: "terminal-bench@2.0"
    agent: terminus-2
    temperature: 0.1
    max_turns: 100
    n_concurrent: 5
    agent_timeout_multiplier: 5
    k: 1
    jobs_dir: jobs
    timeout_sec: 14400


# ─────────────────────────────────────────────────────────────────────────────
# planner_instructions — свободные инструкции LLM-планировщику
# ─────────────────────────────────────────────────────────────────────────────
planner_instructions: |
  Бейзлайн вынесен в baseline.yaml и прогоняется как измеренный эксперимент #1 —
  планировщик итерирует ОТ него (по одному knob за раз). Не генерируй generic-
  бейзлайн заново. Prefix caching держи включённым (обязателен для agentic-цели).


# ─────────────────────────────────────────────────────────────────────────────
# baseline — обычно НЕ задаётся здесь, а лежит в отдельном baseline[N].yaml
# (CLI грузит его как sibling по суффиксу). См. configs/baseline.example.yaml.
# Можно задать инлайн как ExperimentConfig, если хочется один файл.
# ─────────────────────────────────────────────────────────────────────────────
# baseline:
#   engine: vllm
#   tensor_parallel_size: 4
#   ...
