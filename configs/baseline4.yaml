# Operator-defined BASELINE launch config (anchor experiment) — Qwen3-Coder-Next-FP8.
#
# Shaped like an ExperimentConfig. Sibling baseline of config4.yaml (paired by
# numeric suffix). Runs deterministically as experiment #1 — WITHOUT the LLM
# planner — so the harness measures a real anchor. Flags with dedicated schema
# fields live in those fields; everything else passes verbatim through
# extra_engine_args (same order as the prod command). Env vars go in extra_env.
#
# NOTE: --enable-auto-tool-choice / --tool-call-parser are always appended by
# container.vllm_extra_args in config4.yaml — NOT repeated here.
#
# DELIBERATELY OMITTED:
#   --served-model-name Qwen/Qwen3-Coder-Next and the /models/... path (harness
#     addresses by HF id from the mounted cache).
#   --host 0.0.0.0 / --port 8080 — injected by the engine builder (port 8000).

engine: vllm

tensor_parallel_size: 4
max_model_len: 262144

gpu_memory_utilization: 0.88
max_num_seqs: 128
max_num_batched_tokens: 10240

quantization: fp8
dtype: bfloat16

enable_prefix_caching: true
enable_chunked_prefill: true

# --attention-backend FLASH_ATTN → dedicated schema field.
attention_backend: FLASH_ATTN

# Container environment variables — copied verbatim from the prod launch env.
extra_env:
  TZ: "Europe/Moscow"
  CUDA_DISABLE_CONTROL: "true"
  OMP_NUM_THREADS: "96"
  NCCL_CUMEM_ENABLE: "true"
  TORCH_CUDA_ARCH_LIST: "9.0"
  VLLM_FLASH_ATTN_VERSION: "3"

# Flags without a dedicated ExperimentConfig field — passed verbatim, in the same
# order as the prod command. --enable-expert-parallel = MoE expert parallelism.
extra_engine_args:
  - "--enable-expert-parallel"
  - "--enable-prompt-tokens-details"
  - "--enable-force-include-usage"
  - "--async-scheduling"

rationale: >-
  Operator-defined baseline (prod Qwen3-Coder-Next-FP8 on H100x4): TP=4, native
  fp8, bfloat16, expert-parallel MoE, FLASH_ATTN backend, prefix+chunked prefill,
  async scheduling, gpu_mem_util=0.88, max_num_seqs=128,
  max_num_batched_tokens=10240, ctx=262144. The agent's job is to beat this on
  the optimization goals without breaking correctness.
