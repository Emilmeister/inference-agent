# Alembic CLI config — used during development for `alembic revision`,
# `alembic history`, `alembic stamp`, etc. The agent at runtime ignores this
# file and constructs the Config object programmatically (see
# src/inference_agent/db/engine.py:init_schema).
#
# Override the URL here or set DATABASE_* env vars and let the helper script
# build the URL — see scripts/alembic-cli.sh if present, or just export
# `sqlalchemy.url` via -x url=... to the alembic CLI.

[alembic]
script_location = src/inference_agent/db/migrations
prepend_sys_path = .
# `sqlalchemy.url` is intentionally blank — env.py builds the URL from
# `DATABASE_*` env vars + `DB_PASSWORD`, the same names the agent uses.
# Override here only if you want a one-off URL (e.g. for a staging DB).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
