[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference-agent"
version = "0.1.0"
description = "LLM inference benchmark agent — automated vLLM/SGLang configuration optimizer"
requires-python = ">=3.10"
# Agent-only deps. The agent talks to inference-api via HTTP; it does NOT
# import sqlalchemy/asyncpg/alembic. Install the `api` extra to also get the
# REST service (sqlalchemy/asyncpg/alembic/fastapi/uvicorn live there).
dependencies = [
    "langgraph>=0.2",
    "openai>=1.50",
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "prometheus-client>=0.20",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-socks[asyncio]>=2.4",
]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.0",
    "pandas>=2.0",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
    "httpx>=0.27",
    # dev installs everything so tests can exercise the API and DB layers.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-socks[asyncio]>=2.4",
    "requests>=2.31",
]

[project.scripts]
inference-agent = "inference_agent.cli:main"
inference-api = "inference_api.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring a container runtime (Postgres testcontainer)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_agent", "src/inference_api"]
